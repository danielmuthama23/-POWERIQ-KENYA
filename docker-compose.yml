services:
  poweriq:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["poweriq-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health | grep -q '\"ready\":true'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
volumes:
  poweriq-data:
